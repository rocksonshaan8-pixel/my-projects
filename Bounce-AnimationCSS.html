        .box {
            height: 50px;
            width: 50px;
            /* background-color: brown; */
            background-image: url(https://img.freepik.com/free-psd/sport-ball-isolated_23-2151387853.jpg?semt=ais_hybrid&w=740&q=80);
            background-size: 130%;
            background-repeat: no-repeat;
            background-position: center;
            border: 2px solid black;
            border-radius: 50%;
            box-shadow: 0 8px 5px rgba(0, 0, 0, 0.4);
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: bounce 1.5s ease-in-out 0s infinite;
        }

        .x-move {
            animation: moveX 1.5s linear 0s infinite;
        }

        /* Bounce keyframes */
        @keyframes bounce {
            0% {
                transform: translateY(-120px);

            }

            20% {
                transform: translateY(0px);

            }

            40% {
                transform: translateY(-80px);
                /* transform: translateX(10px); */
            }

            60% {
                transform: translateY(0);
            }

            80% {
                transform: translateY(-60px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes moveX {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(50px);
            }

            50% {
                transform: translateX(100px);
            }

            75% {
                transform: translateX(150px);
            }

            100% {
                transform: translateX(200px);
            }
        }
    </style>
